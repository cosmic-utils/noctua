[package]
name = "noctua-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true

[dependencies]
ron = "0.8"
serde = { version = "1.0", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"

# Document backends
image = "0.25"
pdfium-render = { version = "0.8", features = ["sync"], optional = true }
resvg = { version = "0.45", optional = true }

# Thumbnail cache (freedesktop.org spec)
dirs = "5.0"
md5 = "0.7"
png = "0.17"
tracing = "0.1"

[dev-dependencies]
filetime = "0.2"
image = "0.25"
md5 = "0.7"
noctua-core-test-common = { path = "tests/common" }
pdfium-render = { version = "0.8", features = ["sync"] }
png = "0.17"

[features]
default = ["pdfium-render", "resvg"]
